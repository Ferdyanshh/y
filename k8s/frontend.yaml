apiVersion: v1
kind: Service
metadata:
  name: diet-app-frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ocha123/diet-frontend:latest  # <--- GANTI kalau usernamenya beda
        ports:
        - containerPort: 3000